services:
  - type: web
    name: agrilink-backend
    runtime: python
    plan: free
    region: frankfurt  # same region as the Neon project (aws-eu-central-1)
    rootDir: server
    healthCheckPath: /health
    buildCommand: ./build.sh
    startCommand: gunicorn app:create_app() --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: FLASK_APP
        value: app.py
      - key: FLASK_ENV
        value: production
      # Neon Postgres — paste the *pooled* connection string (-pooler host,
      # sslmode=require) from https://console.neon.tech into the Render dashboard
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SESSION_COOKIE_SAMESITE
        value: None
